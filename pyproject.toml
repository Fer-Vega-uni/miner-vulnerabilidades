[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeql-miner"
version = "0.1.0"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "typer[all]>=0.9.0",
    "rich>=13.0.0"
]

[project.scripts]
miner = "miner.cli:app"

[tool.setuptools.packages.find]
where = ["src"]